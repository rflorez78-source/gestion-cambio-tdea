function initMsal(){

  try {

      return SP.msalApp.acquireTokenPopup({ scopes: SP_SCOPES, account: SP.account });
    });
  }).then(function(r){ return r.accessToken; });
}

function graphFetch(url, token, options){
  options = options || {};
  options.headers = options.headers || {};
  options.headers["Authorization"] = "Bearer " + token;
  return fetch(url, options);
}

function resolveSiteId(token){
  if(SP.siteId) return Promise.resolve(SP.siteId);
  var url = "https://graph.microsoft.com/v1.0/sites/" + SP_HOSTNAME + ":" + SP_SITE_PATH;
  return graphFetch(url, token).then(function(r){
    if(!r.ok) return r.json().then(function(j){ throw new Error("No se pudo ubicar el sitio de SharePoint: " + (j.error?j.error.message:r.status)); });
    return r.json();
  }).then(function(site){ SP.siteId = site.id; return SP.siteId; });
}

function graphGetRemoteState(token, siteId){
  var url = "https://graph.microsoft.com/v1.0/sites/" + siteId + "/drive/root:/" + SP_FILE_NAME + ":/content";
  return graphFetch(url, token).then(function(r){
    if(r.status === 404) return {cambios:[]};
    if(!r.ok) return r.json().then(function(j){ throw new Error("No se pudo leer los datos en SharePoint: " + (j.error?j.error.message:r.status)); });
    return r.json();
  }).catch(function(e){ if(e instanceof Error) throw e; return {cambios:[]}; });
}

function graphPutRemoteState(token, siteId, data){
  var url = "https://graph.microsoft.com/v1.0/sites/" + siteId + "/drive/root:/" + SP_FILE_NAME + ":/content";
  return graphFetch(url, token, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data, null, 2)
  }).then(function(r){
    if(!r.ok) return r.json().then(function(j){ throw new Error("No se pudo guardar en SharePoint: " + (j.error?j.error.message:r.status)); });
    return r.json();
  });
}

function mergeCambiosPorId(local, remote){
  var byId = {};
  (remote.cambios||[]).forEach(function(c){ byId[c.id] = c; });
  (local.cambios||[]).forEach(function(c){
    var existente = byId[c.id];
    if(!existente || (c.actualizadoEn||"") > (existente.actualizadoEn||"")) byId[c.id] = c;
  });
  return {cambios: Object.keys(byId).map(function(k){ return byId[k]; })};
}

function handleSincronizar(){
  if(!SP.account){ handleIniciarSesion(); return; }
  if(SP.syncing) return;
  SP.syncing = true; SP.lastError = null; render();
  getGraphToken().then(function(token){
    return resolveSiteId(token).then(function(siteId){
      return graphGetRemoteState(token, siteId).then(function(remoto){
        var combinado = mergeCambiosPorId(STATE, remoto);
        return graphPutRemoteState(token, siteId, combinado).then(function(){ return combinado; });
      });
    });
  }).then(function(combinado){
    STATE = combinado;
    saveState();
    SP.syncing = false;
    SP.lastSync = new Date().toISOString();
    render();
  }).catch(function(err){
    SP.syncing = false;
    SP.lastError = err && err.message ? err.message : String(err);
    render();
  });
}

var DOCUMENTO_MAX_BYTES = 2 * 1024 * 1024;
var DOCUMENTO_EXTENSIONES = [".pdf", ".doc", ".docx"];
var DOCUMENTO_MIME_PERMITIDOS = [
  "application/pdf",
  "application/msword",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
];
function formatBytes(bytes){
  if(bytes >= 1024*1024) return (bytes/(1024*1024)).toFixed(1).replace(/\.0$/,"") + " MB";
  return Math.round(bytes/1024) + " KB";
}
function documentoValido(file){
  var nombre = (file.name||"").toLowerCase();
  var extOk = DOCUMENTO_EXTENSIONES.some(function(ext){ return nombre.endsWith(ext); });
  if(!extOk) return {ok:false, error:'Ese tipo de archivo no está permitido. Solo se aceptan PDF o Word (.pdf, .doc, .docx).'};
  if(file.size > DOCUMENTO_MAX_BYTES) return {ok:false, error:'El archivo pesa '+formatBytes(file.size)+', y el máximo permitido es '+formatBytes(DOCUMENTO_MAX_BYTES)+'. Comprime el documento o adjunta una versión más liviana.'};
  return {ok:true};
}

function esc(s){
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function fmtDate(iso){
  if(!iso) return "—";
  var p = iso.split("-");
  if(p.length!==3) return iso;
  return p[2]+"/"+p[1]+"/"+p[0];
}

function estadoGeneral(c){
  var acc = c.acciones||[];
  if(!acc.length) return "Sin iniciar";
  if(acc.every(function(a){return a.estado==="Terminada";})) return "Terminada";
  if(acc.some(function(a){return a.estado==="En proceso" || a.estado==="Terminada";})) return "En proceso";
  return "Sin iniciar";
}
function esVencido(c){
  var today = todayISO();
  var eg = estadoGeneral(c);
  if(c.plazoLimite && c.plazoLimite < today && eg !== "Terminada") return true;
  return (c.acciones||[]).some(function(a){ return a.fechaSeguimiento && a.fechaSeguimiento < today && a.estado !== "Terminada"; });
}

  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function validateDraft(d){
  var req = [["fechaIdentificacion","Fecha de identificación"],["tipoCambio","Tipo de cambio"],
    ["nombreCambio","Nombre del cambio"],["documentaCambio","Quién documenta el cambio"],
    ["fuenteCambio","Fuente del cambio"],["descripcion","Descripción del cambio"]];
  var faltantes = req.filter(function(r){ return !String(d[r[0]]||"").trim(); }).map(function(r){ return r[1]; });
  var tieneImpacto = d.impactoCambio && IMPACTO_ITEMS.some(function(it){ return d.impactoCambio[it.key]; });
  if(!tieneImpacto) faltantes.push("Impacto del cambio");
  return faltantes;
}

function loadCambioParaEditar(id){
  var c = STATE.cambios.filter(function(x){ return x.id===id; })[0];
  if(!c) return;
  ui.lider.mode = "edit";
  ui.lider.draft = deepClone(c);
  ui.lider.notice = null;
  ui.tab = "lider";
  render();
}

function persistCambioFromDraft(draft){
  var errors = validateDraft(draft);
  if(errors.length) return {ok:false, errors:errors};
  var existingIdx = STATE.cambios.findIndex(function(c){ return c.id===draft.id; });
  if(existingIdx === -1){
    existingIdx = STATE.cambios.findIndex(function(c){
      return c.nombreCambio.trim().toLowerCase() === draft.nombreCambio.trim().toLowerCase();
    });
  }
  var now = new Date().toISOString();
  var toSave = deepClone(draft);
  var isUpdate = existingIdx >= 0;
  if(isUpdate){
    toSave.id = STATE.cambios[existingIdx].id;
    toSave.creadoEn = STATE.cambios[existingIdx].creadoEn || now;
    toSave.comentarios = STATE.cambios[existingIdx].comentarios || [];
    toSave.actualizadoEn = now;
  } else {
    toSave.creadoEn = now;
    toSave.actualizadoEn = now;
    toSave.comentarios = [];
  }
  var newCambios = STATE.cambios.slice();
  if(isUpdate) newCambios[existingIdx] = toSave; else newCambios.push(toSave);
  STATE = {cambios:newCambios};
  saveState();
  return {ok:true, cambio:toSave, isUpdate:isUpdate};
}

function handleGuardar(){
  var result = persistCambioFromDraft(ui.lider.draft);
  if(!result.ok){
    ui.lider.notice = {type:"error", text:"Completa los campos obligatorios: "+result.errors.join(", ")+"."};
    render();
    return;
  }
  ui.lider.mode = "edit";
  ui.lider.draft = deepClone(result.cambio);
  ui.lider.notice = {type:"info", text:'Reporte guardado en este navegador. Usa "Enviar aviso a Calidad, SST y Ambiental" para notificar el registro, o "Exportar mi reporte (JSON)" para respaldarlo.'};
  render();
}

function truncar(s, max){
  s = String(s||"").trim();
  if(!s) return "—";
  if(s.length <= max) return s;
  return s.slice(0, max).trim() + "… (ver detalle completo en el archivo adjunto)";
}

function buildMailtoAviso(cambio, filename, resumido){
  var to = CALIDAD_EMAILS.join(",");
  var subject = "Nuevo cambio registrado (FO-GTH-41): " + (cambio.nombreCambio || "sin nombre");
  var lineas = [
    "Se registró un cambio en la herramienta de Gestión del Cambio (FO-GTH-41).",
    "",
    "Nombre del cambio: " + (cambio.nombreCambio || "—"),
    "Tipo de cambio: " + (cambio.tipoCambio || "—"),
    "Impacto del cambio: " + (IMPACTO_ITEMS.filter(function(it){ return cambio.impactoCambio && cambio.impactoCambio[it.key]; }).map(function(it){ return it.label; }).join(", ") || "—"),
    "Fecha de identificación: " + fmtDate(cambio.fechaIdentificacion),
    "Procesos involucrados: " + ((cambio.procesos||[]).join(", ") || "—"),
    "Documentado por: " + (cambio.documentaCambio || "—"),
    "Fuente del cambio: " + (cambio.fuenteCambio || "—"),
    "Recursos del cambio: " + (RECURSOS_ITEMS.filter(function(it){ return cambio.recursosCambio && cambio.recursosCambio[it.key]; }).map(function(it){ return it.label; }).join(", ") || "—"),
    "Plazo límite: " + fmtDate(cambio.plazoLimite),
    "",
    "Descripción: " + (resumido ? "(ver detalle en el archivo adjunto)" : truncar(cambio.descripcion, 400)),
    "",
    'Adjunto a este correo va el archivo "' + filename + '" con el detalle completo del cambio' + (cambio.documentoAdjunto ? ' (incluye el documento de soporte "'+cambio.documentoAdjunto.nombre+'")' : '') + ' (impórtalo en la pestaña "Vista Calidad, SST y Ambiental" de la herramienta con el botón "Importar reporte de un líder (JSON)" para verlo junto con el resto del consolidado).',
    "",
    "— Enviado desde la herramienta Gestión del Cambio (FO-GTH-41)."
  ];
  var body = lineas.join("\n");
  return "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

/* Algunos clientes de correo truncan o rechazan enlaces mailto: muy largos.
   Si el enlace completo supera un límite seguro, se genera una versión más corta
   (sin la descripción) para que el correo se abra igual, sin perder los datos clave. */
function buildMailtoAvisoSeguro(cambio, filename){
  var LIMITE = 1800;
  var completo = buildMailtoAviso(cambio, filename, false);
  if(completo.length <= LIMITE) return completo;
  return buildMailtoAviso(cambio, filename, true);
}

function handleEnviarAviso(){
  var result = persistCambioFromDraft(ui.lider.draft);
  if(!result.ok){
    ui.lider.notice = {type:"error", text:"Completa los campos obligatorios antes de enviar el aviso: "+result.errors.join(", ")+"."};
    render();
    return;
  }
  var cambio = result.cambio;
  ui.lider.mode = "edit";
  ui.lider.draft = deepClone(cambio);

  var slug = (cambio.nombreCambio||"cambio").toLowerCase()
    .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i").replace(/[óòö]/g,"o").replace(/[úùü]/g,"u").replace(/ñ/g,"n")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "cambio";
  var filename = "cambio_" + slug + "_" + todayISO() + ".json";
  var payload = {formato:"FO-GTH-41", version:1, exportadoEn:new Date().toISOString(), cambios:[cambio]};
  downloadFile(filename, "application/json", JSON.stringify(payload, null, 2));

  window.location.href = buildMailtoAvisoSeguro(cambio, filename);

  ui.lider.notice = {type:"info", text:
    "Reporte enviado: sigue estos 2 pasos para completarlo.\n" +
    '1. Se descargó el archivo "' + filename + '" — no lo muevas ni lo borres todavía.\n' +
    "2. Revisa tu programa de correo: se abrió un borrador dirigido a Calidad, SST y Ambiental. Adjunta ese archivo y presiona Enviar.\n\n" +
    "¿No se abrió ningún correo? Escribe uno tú mismo a estos destinatarios y adjunta el archivo descargado:\n" +
    CALIDAD_EMAILS.join(", ")
  };
  render();
}

function handleAgregarComentario(){
  var id = ui.calidad.detailId;
  var texto = (ui.calidad.commentDraft||"").trim();
  if(!texto) return;
  var idx = STATE.cambios.findIndex(function(c){ return c.id===id; });
  if(idx<0) return;
  var newCambios = STATE.cambios.slice();
  var cambio = deepClone(newCambios[idx]);
  cambio.comentarios = cambio.comentarios || [];
  cambio.comentarios.push({id:uid("cm_"), texto:texto, fecha:new Date().toISOString()});
  newCambios[idx] = cambio;
  STATE = {cambios:newCambios};
  saveState();
  ui.calidad.commentDraft = "";
  renderDetail();
  renderCalidadResults();
}

function distinctProcesos(){
  var s = {};
  STATE.cambios.forEach(function(c){ (c.procesos||[]).forEach(function(p){ s[p]=true; }); });
  return Object.keys(s).sort();
}
function distinctTipos(){
  var s = {};
  STATE.cambios.forEach(function(c){ if(c.tipoCambio) s[c.tipoCambio]=true; });
  return Object.keys(s).sort();
}
function filteredCambios(){
  var f = ui.calidad.filters;
  return STATE.cambios.filter(function(c){
    if(f.proceso && (c.procesos||[]).indexOf(f.proceso)===-1) return false;
    if(f.tipo && c.tipoCambio !== f.tipo) return false;
    if(f.estado && estadoGeneral(c) !== f.estado) return false;
    if(f.desde && c.fechaIdentificacion && c.fechaIdentificacion < f.desde) return false;
    if(f.hasta && c.fechaIdentificacion && c.fechaIdentificacion > f.hasta) return false;
    if(f.responsable){
      var r = f.responsable.toLowerCase();
      var has = (c.acciones||[]).some(function(a){ return (a.responsable||"").toLowerCase().indexOf(r)!==-1; });
      if(!has) return false;
    }
    if(f.q){
      var q = f.q.toLowerCase();
      var hay = [c.nombreCambio,c.tipoCambio,(c.procesos||[]).join(" "),c.descripcion,c.documentaCambio,c.fuenteCambio].join(" ").toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.fechaIdentificacion||"").localeCompare(a.fechaIdentificacion||""); });
}

/* ---------- Generador de Excel (.xlsx) sin librerías externas ---------- */
var XLSX_CRC_TABLE = (function(){
  var t = [];
  for(var n=0;n<256;n++){
    var c = n;
    for(var k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    t[n] = c >>> 0;
  }
  return t;
})();
function xlsxCrc32(bytes){
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++){ crc = (crc >>> 8) ^ XLSX_CRC_TABLE[(crc ^ bytes[i]) & 0xFF]; }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function buildZipStore(files){
  var chunks = [];
  var centralChunks = [];
  var offset = 0;
  function push(arr){ chunks.push(arr); offset += arr.length; }
  var enc = new TextEncoder();
  files.forEach(function(f){
    var nameBytes = enc.encode(f.name);
    var data = f.data;
    var crc = xlsxCrc32(data);
    var localOffset = offset;

    var local = new Uint8Array(30 + nameBytes.length);
    var dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    push(local);
    push(data);

    var central = new Uint8Array(46 + nameBytes.length);
    var cdv = new DataView(central.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x21, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, localOffset, true);
    central.set(nameBytes, 46);
    centralChunks.push(central);
  });

  var centralStart = offset;
  centralChunks.forEach(function(c){ push(c); });
  var centralSize = offset - centralStart;

  var eocd = new Uint8Array(22);
  var edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, centralStart, true);
  edv.setUint16(20, 0, true);
  push(eocd);

  var total = chunks.reduce(function(a,c){return a+c.length;},0);
  var out = new Uint8Array(total);
  var pos = 0;
  chunks.forEach(function(c){ out.set(c, pos); pos += c.length; });
  return out;
}

function xlsxColLetter(n){
  var s = "";
  while(n > 0){
    var rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}
function xlsxCell(colIndex, rowIndex, value, styleIndex){
  var ref = xlsxColLetter(colIndex) + rowIndex;
  var sAttr = styleIndex ? ' s="'+styleIndex+'"' : '';
  return '<c r="'+ref+'" t="inlineStr"'+sAttr+'><is><t xml:space="preserve">'+esc(String(value===null||value===undefined?"":value))+'</t></is></c>';
}
function xlsxNumCell(colIndex, rowIndex, value, styleIndex){
  var ref = xlsxColLetter(colIndex) + rowIndex;
  var sAttr = styleIndex ? ' s="'+styleIndex+'"' : '';
  return '<c r="'+ref+'"'+sAttr+'><v>'+(value===null||value===undefined?0:value)+'</v></c>';
}
function xlsxRow(rowIndex, cellsXml){ return '<row r="'+rowIndex+'">'+cellsXml.join("")+'</row>'; }
function xlsxSheetXml(rowsXml, colWidths, freezeHeader){
  var cols = '<cols>' + colWidths.map(function(w,i){
    return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';
  }).join("") + '</cols>';
  var paneXml = freezeHeader ? '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft"/></sheetView></sheetViews>' : '';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    paneXml + cols + '<sheetData>' + rowsXml.join("") + '</sheetData>' +
    '</worksheet>';
}
function buildSimpleSheet(headers, rows, colWidths){
  var rowsXml = [xlsxRow(1, headers.map(function(h,i){ return xlsxCell(i+1, 1, h, 1); }))];
  rows.forEach(function(r, ridx){
    var cells = r.map(function(cell, cidx){
      var v = (cell && typeof cell === "object" && "v" in cell) ? cell.v : cell;
      var s = (cell && typeof cell === "object" && "s" in cell) ? cell.s : 2;
      return (typeof v === "number") ? xlsxNumCell(cidx+1, ridx+2, v, s) : xlsxCell(cidx+1, ridx+2, v, s);
    });
    rowsXml.push(xlsxRow(ridx+2, cells));
  });
  return xlsxSheetXml(rowsXml, colWidths, true);
}
function estadoStyle(estado){
  return estado==="Terminada" ? 3 : estado==="En proceso" ? 4 : 5;
}

var XLSX_WORKBOOK = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

function handleExportExcel(){
  var list = filteredCambios();
  if(!list.length){ alert("No hay cambios para exportar con los filtros actuales."); return; }

  var totalSinIniciar = list.filter(function(c){return estadoGeneral(c)==="Sin iniciar";}).length;
  var totalEnProceso = list.filter(function(c){return estadoGeneral(c)==="En proceso";}).length;
  var totalTerminada = list.filter(function(c){return estadoGeneral(c)==="Terminada";}).length;
  var totalVencidos = list.filter(esVencido).length;
  var resumenRowsXml = [];
  resumenRowsXml.push(xlsxRow(1, [xlsxCell(1,1,"Control de Cambios · Gestión del Cambio (FO-GTH-41)",7)]));
  resumenRowsXml.push(xlsxRow(2, [xlsxCell(1,2,"Generado: " + new Date().toLocaleString("es-CO"),0)]));
  resumenRowsXml.push(xlsxRow(3, []));
  resumenRowsXml.push(xlsxRow(4, [xlsxCell(1,4,"Indicador",1), xlsxCell(2,4,"Valor",1)]));
  [["Total de cambios", list.length, 2],["Sin iniciar", totalSinIniciar, 5],["En proceso", totalEnProceso, 4],
   ["Terminados", totalTerminada, 3],["Vencidos", totalVencidos, 6]].forEach(function(k, i){
    var r = i+5;
    resumenRowsXml.push(xlsxRow(r, [xlsxCell(1,r,k[0],2), xlsxNumCell(2,r,k[1],k[2])]));
  });
  var resumenSheet = xlsxSheetXml(resumenRowsXml, [40, 14], false);

  var cambiosHeaders = ["Fecha Identificación","Tipo de Cambio","Impacto del Cambio","Nombre del Cambio","Procesos Involucrados","Documentado por","Fuente del Cambio","Recursos del Cambio","Documento Adjunto","Plazo Límite","Estado General","Vencido","N° Acciones","Última Actualización"];
  var cambiosRows = list.map(function(c){
    var eg = estadoGeneral(c);
    var vencido = esVencido(c);
    var impactoTxt = IMPACTO_ITEMS.filter(function(it){ return c.impactoCambio && c.impactoCambio[it.key]; }).map(function(it){ return it.label; }).join(", ");
    var recursosCambioTxt = RECURSOS_ITEMS.filter(function(it){ return c.recursosCambio && c.recursosCambio[it.key]; }).map(function(it){ return it.label; }).join(", ");
    return [
      fmtDate(c.fechaIdentificacion), c.tipoCambio, impactoTxt || "—", c.nombreCambio, (c.procesos||[]).join(", "),
      c.documentaCambio, c.fuenteCambio, recursosCambioTxt || "—", (c.documentoAdjunto ? c.documentoAdjunto.nombre : "—"), fmtDate(c.plazoLimite),
      {v: eg, s: estadoStyle(eg)}, {v: vencido ? "Sí":"No", s: vencido ? 6 : 2},
      {v: (c.acciones||[]).length, s:2},
      c.actualizadoEn ? new Date(c.actualizadoEn).toLocaleString("es-CO") : "—"
    ];
  });
  var cambiosSheet = buildSimpleSheet(cambiosHeaders, cambiosRows, [16,14,26,30,26,20,14,22,20,14,14,10,12,20]);

  var accionesHeaders = ["Cambio","Fecha Identificación","Ítem(s) a Evaluar","Acción a Ejecutar","Responsable","Fecha de Seguimiento","Estado","Recursos"];
  var accionesRows = [];
  list.forEach(function(c){
    (c.acciones||[]).forEach(function(a){
      var itemsTxt = (a.items||[]).map(function(i){ return i===OTRO_INDEX ? ("Otros: "+(a.otroTexto||"")) : ITEMS_EVALUAR[i]; }).join("; ");
      var recTxt = Object.keys(RECURSOS_LABELS).filter(function(k){ return a.recursos && a.recursos[k]; }).map(function(k){ return RECURSOS_LABELS[k]; }).join(", ");
      accionesRows.push([
        c.nombreCambio, fmtDate(c.fechaIdentificacion), itemsTxt || "—", a.accion || "—",
        a.responsable || "—", fmtDate(a.fechaSeguimiento), {v:a.estado, s: estadoStyle(a.estado)}, recTxt || "—"
      ]);
    });
  });
  if(!accionesRows.length){ accionesRows.push(["—","—","—","—","—","—","—","—"]); }
  var accionesSheet = buildSimpleSheet(accionesHeaders, accionesRows, [26,16,34,34,18,16,14,20]);

  var enc = new TextEncoder();
  var files = [
    {name:"[Content_Types].xml", data: enc.encode(XLSX_CONTENT_TYPES)},
    {name:"_rels/.rels", data: enc.encode(XLSX_RELS)},
    {name:"xl/workbook.xml", data: enc.encode(XLSX_WORKBOOK)},
    {name:"xl/_rels/workbook.xml.rels", data: enc.encode(XLSX_WORKBOOK_RELS)},
    {name:"xl/styles.xml", data: enc.encode(XLSX_STYLES_XML)},
    {name:"xl/worksheets/sheet1.xml", data: enc.encode(resumenSheet)},
    {name:"xl/worksheets/sheet2.xml", data: enc.encode(cambiosSheet)},
    {name:"xl/worksheets/sheet3.xml", data: enc.encode(accionesSheet)}
  ];
  var zipBytes = buildZipStore(files);
  downloadFile("control_cambios_fo_gth_41_"+todayISO()+".xlsx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", zipBytes);
}

function handleExportJSON(){
  if(!STATE.cambios.length){ alert("Todavía no hay cambios registrados en este navegador para exportar."); return; }
  var payload = {formato:"FO-GTH-41", version:1, exportadoEn:new Date().toISOString(), cambios:STATE.cambios};
  downloadFile("cambios_fo_gth_41_"+todayISO()+".json", "application/json", JSON.stringify(payload, null, 2));
}

function handleImportJSONFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(String(reader.result)); }
    catch(e){ alert("El archivo seleccionado no es un JSON válido."); return; }
    var incoming = Array.isArray(data.cambios) ? data.cambios : (Array.isArray(data) ? data : null);
    if(!incoming){ alert('El archivo no tiene el formato esperado (debe ser un JSON exportado desde esta misma herramienta con "Exportar mi reporte (JSON)").'); return; }
    var added = 0, updated = 0;
    incoming.forEach(function(c){
      if(!c || !c.nombreCambio) return;
      var idx = STATE.cambios.findIndex(function(x){ return x.id === c.id; });
      if(idx === -1){
        idx = STATE.cambios.findIndex(function(x){
          return x.nombreCambio && c.nombreCambio && x.nombreCambio.trim().toLowerCase() === c.nombreCambio.trim().toLowerCase();
        });
      }
      if(idx === -1){ STATE.cambios.push(c); added++; }
      else { STATE.cambios[idx] = c; updated++; }
    });
    saveState();
    render();
    alert("Importación completa: " + added + " cambio(s) nuevo(s), " + updated + " actualizado(s).");
  };
  reader.readAsText(file);
}

/* ---------- events ---------- */
function onInput(e){
  var t = e.target;
  if(t.id === "select-existing"){
    if(t.value) loadCambioParaEditar(t.value);
    return;
  }
  if(t.id === "select-proceso-base"){
    var val = t.value;
    if(val){
      ui.lider.draft.procesos = ui.lider.draft.procesos || [];
      if(ui.lider.draft.procesos.indexOf(val)===-1) ui.lider.draft.procesos.push(val);
      renderProcesosSection();
      var newSel = document.getElementById("select-proceso-base");
      if(newSel) newSel.value = "";
    }
    return;
  }
  if(t.hasAttribute("data-field")){
    ui.lider.draft[t.dataset.field] = t.value;
    return;
  }
  if(t.hasAttribute("data-field-accion")){
    var acc = ui.lider.draft.acciones.filter(function(a){ return a.id===t.dataset.accionId; })[0];
    if(acc){
      acc[t.dataset.fieldAccion] = t.value;
      if(t.dataset.fieldAccion === "estado"){
        t.classList.remove("estado-sin-iniciar","estado-proceso","estado-terminada");
        t.classList.add(t.value==="Terminada"?"estado-terminada":t.value==="En proceso"?"estado-proceso":"estado-sin-iniciar");
      }
    }
    return;
  }
  if(t.hasAttribute("data-clasificacion")){
    ui.lider.draft.clasificacion[t.dataset.clasificacion] = t.checked;
    updateClasificacionBanner();
    return;
  }
  if(t.hasAttribute("data-impacto")){
    ui.lider.draft.impactoCambio = ui.lider.draft.impactoCambio || {};
    ui.lider.draft.impactoCambio[t.dataset.impacto] = t.checked;
    return;
  }
  if(t.hasAttribute("data-recurso-cambio")){
    ui.lider.draft.recursosCambio = ui.lider.draft.recursosCambio || {};
    ui.lider.draft.recursosCambio[t.dataset.recursoCambio] = t.checked;
    return;
  }
  if(t.hasAttribute("data-accion-item")){
    var acc2 = ui.lider.draft.acciones.filter(function(a){ return a.id===t.dataset.accionId; })[0];
    if(!acc2) return;
    var idx = Number(t.dataset.itemIndex);
    acc2.items = acc2.items || [];
    if(t.checked){ if(acc2.items.indexOf(idx)===-1) acc2.items.push(idx); }
    else { acc2.items = acc2.items.filter(function(i){ return i!==idx; }); }
    var card = t.closest(".accion-card");
    var summary = card.querySelector(".item-dropdown summary");
    summary.textContent = acc2.items.length ? acc2.items.length + " seleccionado(s)" : "Selecciona uno o más ítems";
    var otroField = card.querySelector("[data-otro-field]");
    if(otroField) otroField.hidden = acc2.items.indexOf(OTRO_INDEX) === -1;
    return;
  }
  if(t.hasAttribute("data-recurso")){
    var acc3 = ui.lider.draft.acciones.filter(function(a){ return a.id===t.dataset.accionId; })[0];
    if(acc3){ acc3.recursos = acc3.recursos || {}; acc3.recursos[t.dataset.recurso] = t.checked; }
    return;
  }
  if(t.hasAttribute("data-filter")){
    ui.calidad.filters[t.dataset.filter] = t.value;
    renderCalidadResults();
    return;
  }
  if(t.hasAttribute("data-comment-draft")){
    ui.calidad.commentDraft = t.value;
    return;
  }
}

function onClick(e){
  if(e.target.dataset && e.target.dataset.action === "cerrar-detalle-overlay"){
    ui.calidad.detailId = null; ui.calidad.commentDraft = ""; renderDetail(); return;
  }
  var btn = e.target.closest("[data-action]");
  if(!btn) return;
  var action = btn.dataset.action;
  if(action === "switch-tab"){ ui.tab = btn.dataset.tab; render(); }
  else if(action === "nuevo-cambio"){ ui.lider.mode="new"; ui.lider.draft=emptyDraft(); ui.lider.notice=null; render(); }
  else if(action === "cancelar-edicion"){ ui.lider.mode="new"; ui.lider.draft=emptyDraft(); ui.lider.notice=null; render(); }
  else if(action === "agregar-accion"){ ui.lider.draft.acciones.push(emptyAccion()); renderAccionesSection(); }
  else if(action === "quitar-accion"){ ui.lider.draft.acciones = ui.lider.draft.acciones.filter(function(a){ return a.id!==btn.dataset.accionId; }); renderAccionesSection(); }
  else if(action === "agregar-proceso-custom"){
    var input = document.getElementById("input-proceso-custom");
    var val = (input.value||"").trim();
    if(val){
      ui.lider.draft.procesos = ui.lider.draft.procesos || [];
      if(ui.lider.draft.procesos.indexOf(val)===-1) ui.lider.draft.procesos.push(val);
      renderProcesosSection();
    }
  }
  else if(action === "quitar-proceso"){
    ui.lider.draft.procesos = ui.lider.draft.procesos.filter(function(p){ return p!==btn.dataset.proceso; });
    renderProcesosSection();
  }
  else if(action === "guardar-cambio"){ handleGuardar(); }
  else if(action === "enviar-aviso"){ handleEnviarAviso(); }
  else if(action === "abrir-detalle"){ ui.calidad.detailId = btn.dataset.id; ui.calidad.commentDraft=""; renderDetail(); }
  else if(action === "cerrar-detalle"){ ui.calidad.detailId = null; ui.calidad.commentDraft=""; renderDetail(); }
  else if(action === "agregar-comentario"){ handleAgregarComentario(); }
  else if(action === "limpiar-filtros"){ ui.calidad.filters = {proceso:"",tipo:"",estado:"",desde:"",hasta:"",responsable:"",q:""}; render(); }
  else if(action === "exportar-excel"){ handleExportExcel(); }
  else if(action === "exportar-json"){ handleExportJSON(); }
  else if(action === "trigger-import"){ document.getElementById("import-file-input").click(); }
  else if(action === "trigger-documento"){ document.getElementById("documento-adjunto-input").click(); }
  else if(action === "quitar-documento"){ ui.lider.draft.documentoAdjunto = null; renderDocumentoAdjuntoSection(); }
  else if(action === "editar-desde-detalle"){ loadCambioParaEditar(btn.dataset.id); }
  else if(action === "iniciar-sesion"){ handleIniciarSesion(); }
  else if(action === "continuar-sin-sesion"){ ui.gateDismissed = true; render(); }
  else if(action === "cerrar-sesion"){ handleCerrarSesion(); }
  else if(action === "sincronizar-sharepoint"){ handleSincronizar(); }
  else if(action === "descargar-documento"){
    var cambio = STATE.cambios.filter(function(c){ return c.id===btn.dataset.id; })[0];
    if(cambio && cambio.documentoAdjunto) descargarDataUrl(cambio.documentoAdjunto.nombre, cambio.documentoAdjunto.dataUrl);
  }
}

function onChange(e){
  if(e.target.id === "import-file-input"){
    var file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(file) handleImportJSONFile(file);
    return;
  }
  if(e.target.id === "documento-adjunto-input"){
    var docFile = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!docFile) return;
    var check = documentoValido(docFile);
    if(!check.ok){ alert(check.error); return; }
    var reader = new FileReader();
    reader.onload = function(){
      ui.lider.draft.documentoAdjunto = {nombre: docFile.name, tipo: docFile.type, tamano: docFile.size, dataUrl: reader.result};
      renderDocumentoAdjuntoSection();
    };
    reader.onerror = function(){ alert("No se pudo leer el archivo. Intenta de nuevo."); };
    reader.readAsDataURL(docFile);
    return;
  }
}

function bindEvents(){
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("submit", function(e){ e.preventDefault(); });
}

function boot(){
  bindEvents();
  initMsal();
  render();
}
boot();
})();
